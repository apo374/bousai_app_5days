{% extends "base.html" %}

{% block content %}
<style>
  .register-choice {
    max-width: 760px;
    margin: 48px auto 0;
    color: #202020;
  }

  .register-choice h2 {
    margin: 0 0 34px;
    font-size: clamp(1.4rem, 2.3vw, 2rem);
    font-weight: 700;
  }

  .choice-list {
    display: grid;
    gap: 28px;
  }

  .choice-row {
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .choice-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 190px;
    min-height: 58px;
    flex: 0 0 190px;
    background: #deebf7;
    border: 1px solid #c7d9e8;
    border-radius: 10px;
    color: #202020;
    font-size: 1.08rem;
    font-weight: 700;
  }

  .choice-description {
    margin: 0;
    font-size: 1rem;
  }

  @media (max-width: 620px) {
    .register-choice {
      margin-top: 30px;
    }

    .choice-row {
      align-items: flex-start;
      flex-direction: column;
      gap: 10px;
    }

    .choice-button {
      width: min(100%, 260px);
      flex-basis: auto;
    }
  }
</style>

<section class="register-choice">
  <h2>新規登録あるいは更新を選んでください。</h2>

  <div class="choice-list">
    <div class="choice-row">
      <a class="choice-button" href="{{ url_for('shelter_register') }}?mode=new">新規登録</a>
      <p class="choice-description">避難所の新規登録を行う場合はこちら</p>
    </div>
    <div class="choice-row">
      <a class="choice-button" href="{{ url_for('shelter_register') }}?mode=update">更新</a>
      <p class="choice-description">避難所の更新を行う場合はこちら</p>
    </div>
  </div>
</section>
{% endblock %}
