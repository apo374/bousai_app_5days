<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --header-blue: #0a4d7a;
      --header-blue-strong: #083a5b;
      --page-bg: #eff1f3;
      --card-bg: #f7f8f9;
      --panel-border: #dfe5eb;
      --text-main: #1d2b3a;
      --text-sub: #586a7d;
      --accent-blue: #1689d4;
      --accent-green: #2dbf78;
      --accent-green-deep: #1ea566;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text-main);
      font-family: "Segoe UI", "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app-header {
      background: linear-gradient(90deg, var(--header-blue-strong), var(--header-blue));
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px 0 26px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
    }

    .app-header .brand {
      font-size: clamp(1.4rem, 2vw, 2.2rem);
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      position: relative;
      cursor: pointer;
      padding: 0;
    }

    .menu-button span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.9);
    }

    .menu-button span:nth-child(1) { top: 5px; }
    .menu-button span:nth-child(2) { top: 14px; }
    .menu-button span:nth-child(3) { top: 23px; }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .nav-inline {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .nav-inline a {
      color: var(--text-sub);
    }

    .nav-inline .status {
      margin-left: 8px;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="brand">防災アプリ</h1>
    <button class="menu-button" type="button" aria-label="メニューを開く">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main>
    <nav class="nav-inline" aria-label="ナビゲーション">
      <a href="/">ホーム</a>
      <span>|</span>
      <a href="/shelter_search">避難所検索</a>
      <span>|</span>
      <a href="/shelter_register">避難所登録</a>
      <span>|</span>
      <a href="/board">指示・発信ボード</a>
      {% if session.logged_in %}
        <span>|</span>
        <span class="status">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
        <a href="/logout">ログアウト</a>
      {% else %}
        <span>|</span>
        <span class="status">未ログイン</span>
        <a href="/login">ログイン</a>
      {% endif %}
    </nav>

    {% block content %}{% endblock %}
  </main>
</body>
</html>
